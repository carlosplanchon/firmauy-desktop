name: Release

# Tags only. The everyday CI builds the same bundle on every push and throws it away after a week,
# which is right for finding out whether the build still works and wrong as a place to get the
# program from. This is the other thing: it runs once per version, publishes an archive that stays,
# and signs a statement about where that archive came from.
on:
  push:
    tags: ["v*"]

# The lockfile is half of "this came from that commit". Measured: with pyproject.toml and uv.lock
# out of step, `uv sync` rewrote the lock and built from it, so the attestation would name a commit
# whose dependencies were never the ones used. This makes that an error instead.
env:
  UV_LOCKED: "1"

# Nothing at the top, and the two jobs below ask only for what each one needs. That is the whole
# reason they are two jobs: everything that runs project code, third-party build steps and the
# install scripts of dependencies does so with no authority to publish anything, and the job that
# holds that authority runs none of it.
permissions: {}

jobs:
  build:
    name: build and check
    # Pinned, and not to "latest", because PyInstaller does not bundle glibc: the binary uses the
    # one on the machine that runs it, and the libraries collected into it carry the symbol
    # versions of the machine that built it. 22.04 carries glibc 2.35, one release above PySide6's
    # own manylinux_2_34 wheel, which is the hard floor underneath.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The interpreter is not a build tool here, it is part of the product: PyInstaller freezes it
      # into the bundle. Left unsaid, the version people run is whichever one uv felt like
      # resolving on the day, which is a strange thing not to decide about a signing application.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            build-essential swig libpcsclite-dev \
            desktop-file-utils

      - name: Install dependencies
        run: uv sync

      # The version in the tag has to be the version in the package, or the archive is named after
      # something the program does not call itself. Checked before anything is built, so a mistyped
      # tag costs a minute rather than a published release that has to be deleted.
      - name: The tag and the package agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/firmauy_desktop/__init__.py)
          if [ "$tag" != "$declared" ]; then
            echo "::error::el tag dice $tag y el paquete dice $declared"
            exit 1
          fi
          if ! grep -q "<release version=\"$declared\"" \
                 packaging/linux/com.firmauy.firmauydesktop.metainfo.xml; then
            echo "::error::el AppStream no declara una release $declared"
            exit 1
          fi
          # A warning and not an error. The date belongs to the day somebody decided to publish,
          # which a build cannot know and a timezone can disagree about, so this says it out loud
          # and gets out of the way rather than failing a release at one minute past midnight.
          stamped=$(sed -n 's/.*<release version="'"$declared"'"[^>]*date="\([^"]*\)".*/\1/p' \
                    packaging/linux/com.firmauy.firmauydesktop.metainfo.xml)
          today=$(date -u +%Y-%m-%d)
          if [ "$stamped" != "$today" ]; then
            echo "::warning::el AppStream fecha la $declared el $stamped y hoy es $today"
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # The whole suite, not only the bundle checks below. A tag is a name pointed at a commit by
      # hand, and nothing stops it landing on one whose tests never passed or never ran. Minutes
      # spent here are minutes spent once per version, against publishing the one build nobody
      # checked.
      - name: Ruff
        run: uvx ruff check

      - name: The suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Every screen in every state
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m tools.storybook --shot "$RUNNER_TEMP/shots" --scheme both

      - name: Build it
        run: uv run pyinstaller --clean --noconfirm packaging/firmauy-desktop.spec

      - name: Make the fixture
        run: uv run python -m tools.verify_fixture "$RUNNER_TEMP/fixture"

      - name: Check what PyInstaller wrote
        run: packaging/check_bundle.sh dist/firmauy-desktop "$RUNNER_TEMP/fixture"

      - name: Pack it
        run: |
          packaging/linux/make_release.sh dist/firmauy-desktop "$RUNNER_TEMP/release"
          rm -rf dist

      # dist/ is gone by now on purpose: a check that can still reach the original tree is a check
      # that can pass while the artifact is broken.
      - name: Unpack it the way somebody would
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$RUNNER_TEMP/release"/*.tar.gz
          echo "RELEASE_DIR=$(echo "$RUNNER_TEMP/unpacked"/*/)" >> "$GITHUB_ENV"

      - name: Check what comes back out of the archive
        run: packaging/check_bundle.sh "$RELEASE_DIR/firmauy-desktop" "$RUNNER_TEMP/fixture"

      - name: Install it, upgrade it and take it away
        env:
          CHECK_SYSTEM_INSTALL: "1"
        run: packaging/linux/check_install.sh "$RELEASE_DIR"

      # Handed to the next job rather than published from here. The zip this travels in loses file
      # permissions, which is the reason the release is a tarball in the first place, and does not
      # touch the bytes inside it: measured, the archive's SHA-256 is identical on both sides, so
      # the digest the attestation covers is the digest somebody downloading ends up with.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error

  build-windows:
    name: build and check on Windows
    # Its own job rather than a matrix entry of the one above: almost no step is shared, and a
    # matrix would turn every step into a branch on the OS. Same authority, which is none.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # The tag was already held against __version__ in the other job. This one only reads it.
      - name: The version
        run: |
          $init = Get-Content src/firmauy_desktop/__init__.py -Raw
          if ($init -notmatch '(?m)^__version__ = "([^"]+)"') { throw "sin __version__" }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      # The suite again, on the platform this job ships for. What passes on Linux can still trip
      # over a path separator or a font here, and this is the build people on Windows will run.
      - name: The suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Build it
        run: uv run pyinstaller --clean --noconfirm packaging/firmauy-desktop.spec

      - name: Make the fixture
        run: uv run python -m tools.verify_fixture "$env:RUNNER_TEMP\fixture"

      - name: Check what PyInstaller wrote
        run: >
          packaging/windows/check_bundle.ps1 -Root dist/firmauy-desktop
          -Fixture "$env:RUNNER_TEMP\fixture" -Version $env:VERSION

      - name: Pack it
        run: |
          packaging/windows/make_release.ps1 -Bundle dist/firmauy-desktop -Out "$env:RUNNER_TEMP\release"
          Remove-Item dist -Recurse -Force

      - name: Unzip it the way somebody would
        run: |
          Expand-Archive "$env:RUNNER_TEMP\release\*.zip" -DestinationPath "$env:RUNNER_TEMP\unpacked"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\unpacked" -Directory | Select-Object -First 1).FullName
          "RELEASE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Check what comes back out of the zip
        run: >
          packaging/windows/check_bundle.ps1 -Root "$env:RELEASE_DIR\firmauy-desktop"
          -Fixture "$env:RUNNER_TEMP\fixture" -Version $env:VERSION

      - name: Install it, upgrade it and take it away
        run: >
          packaging/windows/check_install.ps1
          -Setup (Get-Item "$env:RUNNER_TEMP\release\*-setup.exe").FullName
          -Fixture "$env:RUNNER_TEMP\fixture"

      # Handed over the same way as the Linux archive, under its own name so the two cannot
      # overwrite each other on the way to the job that publishes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-windows
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.zip.sha256
            ${{ runner.temp }}/release/*-setup.exe
            ${{ runner.temp }}/release/*-setup.exe.sha256
          compression-level: 0
          if-no-files-found: error

  publish:
    name: attest and publish
    needs: [build, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write        # the OIDC token the attestation is signed against
      attestations: write    # to record it
      contents: write        # to create the release and attach the files
    # No checkout, and none is needed. This job runs nothing out of the repository and nothing out
    # of any dependency: it receives bytes that were already checked and does the two things that
    # require the authority above.
    steps:
      # Both builds into one directory: "release" from Linux and "release-windows". The names
      # inside cannot collide, since each carries its platform.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release*
          merge-multiple: true
          path: release

      # The checksum was written next to the archive in the other job, and this is the first
      # moment anything reads it. GitHub validates its own artifact digest on the way through, so
      # this is not about expecting corruption: it is that the file published as "the checksum of
      # this archive" has, until here, only ever been believed. One line makes it a thing that was
      # checked, right before the digest is signed and the pair is published together.
      - name: The checksum still describes the archive
        run: cd release && sha256sum -c ./*.sha256

      # What the SHA-256 beside the archive cannot say. A digest proves the download was not
      # corrupted on the way and nothing about who produced it: served from the same page as the
      # file, whoever could replace one could replace both. This signs a statement that this exact
      # archive came out of this workflow, in this repository, from this commit, and a person
      # checks it with:
      #
      #     gh attestation verify firmauy-desktop-*.tar.gz -R carlosplanchon/firmauy-desktop
      #
      # It is not a signature by the project: the key is GitHub's and the claim is about the build,
      # not about anybody's intent to release. A key of this project's own would say that, and
      # there is not one yet.
      #
      # actions/attest rather than actions/attest-build-provenance. Its own README says that as of
      # version 4 the latter "is simply a wrapper on top of actions/attest", and the action.yml at
      # the pinned commit does exactly one thing: call actions/attest@508db95 with what it was
      # given. One layer fewer to pin, review and trust.
      - name: Attest where this came from
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*-setup.exe

      # gh rather than a third-party action: it ships on the runner and needs no extra dependency
      # in the one job whose whole point is being able to say where its output came from.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag because gh will otherwise create a tag from the default branch when
          # handed one that does not exist, and this workflow publishes tags rather than making
          # them. --prerelease and --latest=false while the README says alpha and the AppStream
          # says development: three places describing the same thing, and GitHub is the one a
          # person meets first.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "FirmaUY Desktop ${{ needs.build.outputs.version }}" \
            --notes "Linux x86_64, glibc 2.35 y superiores. Descomprimí y corré, o usá el install.sh que viene adentro.

          Windows 10 y 11 de 64 bits: el instalador (-setup.exe), o el .zip para correrlo sin instalar. Todavía no está firmado con un certificado de código, así que Windows puede avisar que protegió tu equipo: Más información, y después Ejecutar de todas formas.

          Para comprobar que el archivo salió de este repositorio y no de otro lado:

              gh attestation verify <archivo> -R ${{ github.repository }}

          El .sha256 al lado cubre la corrupción de la descarga, no el origen." \
            release/*.tar.gz \
            release/*.tar.gz.sha256 \
            release/*.zip \
            release/*.zip.sha256 \
            release/*-setup.exe \
            release/*-setup.exe.sha256
